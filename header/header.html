<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Header</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="header.css">
</head>

<body>
  <!--
    Header component: logo, light/dark switch and search bar.
    index.html copies in the elements marked data-component (see include.js),
    so this page can also be opened on its own while working on the header.
  -->

  <!-- Hidden checkbox that switches the light/dark theme (see style.css) -->
  <input type="checkbox" id="theme-toggle" class="theme-checkbox" data-component>

  <header class="nav container" data-component>
    <div class="nav-top">
      <a href="../index.html" class="logo-link" aria-label="Planet home">
        <img src="../logo_black.png" alt="Planet" class="logo">
      </a>

      <label for="theme-toggle" class="theme-switch">
        <span class="theme-label label-dark">Dark</span>
        <svg class="theme-icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
        <span class="theme-label label-light">Light</span>
        <svg class="theme-icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" stroke-width="2" stroke-linecap="round" fill="none"/>
        </svg>
      </label>
    </div>

    <form class="search" role="search" action="#" onsubmit="return false">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/>
        <path d="M20 20l-3.5-3.5"/>
      </svg>
      <input type="search" class="search-input" placeholder="Search planet name" aria-label="Search planet name">
      <button type="submit" class="search-btn">Search</button>
    </form>
  </header>
</body>

</html>
