<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="header/header.css">
  <link rel="stylesheet" href="planet-card/planet-card.css">
  <link rel="stylesheet" href="planet-table/planet-table.css">
  <link rel="stylesheet" href="footer/footer.css">
</head>

<body>
  <!--
    This page is built from the component files. include.js replaces each
    <div data-include="..."> with that component's markup, so edit the
    component's own HTML file, not this one.
  -->

  <!-- Navbar section -->
  <div data-include="header/header.html"></div>

  <main class="container">

    <!-- Planet card section -->
    <div data-include="planet-card/planet-card.html"></div>

    <!-- Planetary facts table section -->
    <div data-include="planet-table/planet-table.html"></div>

  </main>
  

  <!-- Footer section -->
  <div data-include="footer/footer.html"></div>

  <script src="include.js"></script>
  <script src="planet-card/planet-card.js"></script>
</body>

</html>
